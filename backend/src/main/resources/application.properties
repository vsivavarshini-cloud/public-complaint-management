spring.application.name=public-complaint-backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/public_complaint_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=never
server.port=8080