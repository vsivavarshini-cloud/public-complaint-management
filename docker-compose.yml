services:
  mysql:
    image: mysql:8.0
    container_name: public-complaint-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: public_complaint_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: public-complaint-backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/public_complaint_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
      DB_USERNAME: root
      DB_PASSWORD: root
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: public-complaint-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
